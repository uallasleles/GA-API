<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Astória API &middot; Admin</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    padding: 32px 28px;
  }
  .card h1 { margin: 0 0 4px; font-size: 1.25rem; color: #0f172a; }
  .card p.subtitle { margin: 0 0 24px; font-size: 0.875rem; color: #64748b; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; margin-bottom: 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px; background: #0f172a; color: #fff;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1e293b; }
  .error {
    background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 0.85rem; padding: 10px 12px;
    border-radius: 8px; margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Astória API</h1>
    <p class="subtitle">Painel administrativo</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
